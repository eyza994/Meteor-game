name: Update Leaderboard
on:
  repository_dispatch:
    types: [submit-score]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update Gist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const gistId = '417fb9c970dc053e4ef50be1d91af4f4';
            const newScore = JSON.parse(process.env.SCORE);
            
            const gist = await github.rest.gists.get({ gist_id: gistId });
            let data = JSON.parse(gist.data.files['scores.json'].content);
            
            data.scores.push(newScore);
            data.scores.sort((a, b) => b.score - a.score);
            data.scores = data.scores.slice(0, 10);
            
            await github.rest.gists.update({
              gist_id: gistId,
              files: { 'scores.json': { content: JSON.stringify(data) }
            });
