<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meteor Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; }
    canvas { display:block; margin:0 auto; background:#111; }
    #score, #leaderboard { margin-top:10px; }
  </style>
</head>
<body>
  <h2>🚀 Meteor Game</h2>
  <canvas id="game" width="400" height="600"></canvas>
  <div id="score">Score: 0</div>
  
  <div id="leaderboard">
    <h3>Top 10 Leaderboard</h3>
    <ol id="scoreList"></ol>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let score = 0;
    let gameOver = false;
    let playerName = prompt("Masukin nama lu:") || "Player";

    // Ganti bagian ini sesuai repo lu
    const REPO_OWNER = 'eyza994';
    const REPO_NAME = 'Meteor-game';

    // Game logic sederhana
    function updateScore(points) {
      score += points;
      document.getElementById('score').textContent = 'Score: ' + score;
    }

    function endGame() {
      if (gameOver) return;
      gameOver = true;
      submitScore(playerName, score);
      alert('Game Over! Skor lu: ' + score);
    }

    // Kirim skor ke GitHub Actions
    async function submitScore(name, score) {
      const payload = {
        name: name,
        score: score,
        time: new Date().toISOString()
      };

      try {
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.everest-preview+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'submit-score',
            client_payload: payload
          })
        });
        loadLeaderboard();
      } catch (err) {
        console.error('Gagal submit skor:', err);
      }
    }

    // Ambil leaderboard dari Gist
    async function loadLeaderboard() {
      try {
        const res = await fetch('https://api.github.com/gists/417fb9c970dc053e4ef50be1d91af4f4');
        const gist = await res.json();
        const data = JSON.parse(gist.files['scores.json'].content);
        
        const list = document.getElementById('scoreList');
        list.innerHTML = '';
        data.scores.forEach(s => {
          const li = document.createElement('li');
          li.textContent = `${s.name}: ${s.score}`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error('Gagal load leaderboard:', err);
      }
    }

    // Simulasi game sederhana buat test
    canvas.addEventListener('click', () => {
      if (!gameOver) updateScore(10);
    });
    setTimeout(endGame, 30000); // game over 30 detik

    loadLeaderboard();
  </script>
</body>
  </html>
